name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json missing! Add GitHub Repository Secret named GOOGLE_SERVICES_JSON (copy contents of app/google-services.json from AI Studio)."
            exit 1
          fi

      - name: Run unit tests (PrayerCalculatorTest)
        run: gradle :app:testDebugUnitTest --tests "com.example.data.islamic.PrayerCalculatorTest" --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: manobseba-foundation-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
